[project]
name = "custodian"
version = "0.1.0"
description = "TLS certificate discovery, risk assessment and ACME renewal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "cryptography>=44.0",
]

[project.optional-dependencies]
# The LLM planner is optional on purpose. With LLM_DISABLED=true (the
# default) neither SDK is imported, so the service runs with no AI
# dependency at all.
llm-anthropic = ["anthropic>=0.40"]
llm-openai = ["openai>=1.60"]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
# auto mode means async tests do not each need an explicit marker.
asyncio_mode = "auto"
testpaths = ["tests"]
# Warnings are errors. cryptography deprecates APIs on a schedule (the
# not_valid_after property became not_valid_after_utc), and a suite that
# tolerates warnings is how you find out about that from a production
# traceback instead.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "S101",  # asserts are the point in tests
    "E501",  # long lines in docstrings are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
